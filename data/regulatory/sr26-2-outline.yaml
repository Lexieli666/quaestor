# Report-section anchors (02-SPEC.md section 3.11), current guidance:
#   conceptual soundness -> V.1.a; data integrity -> IV.1 ("critical assessment of data quality,
#   relevance, and inputs"); outcomes analysis -> V.1.b; sensitivity and scenario analysis -> IV.1
#   ("comparison of alternative assumptions and methodologies") and V.1.a (benchmarking);
#   ongoing monitoring -> V.2; documentation -> VI.3; effective challenge -> III.
# Scope notes worth quoting in the README: II sets the guidance's expected relevance at banking
# organizations over $30 billion in total assets and says it "does not set forth enforceable
# standards"; footnote 3 excludes generative and agentic AI models from scope while keeping
# traditional statistical models within it -- the copilot is out of scope, the subjects it validates
# are in scope.
# SR 11-7 stays in the corpus as the superseded text (document SR11-7, its own outline file) so that
# historical citations resolve; the drafter cites SR26-2 by default.
