# Section outline of SR 26-2, "Revised Guidance on Model Risk Management" (Board of Governors of
# the Federal Reserve System, SR Letter 26-2, April 17, 2026; interagency with the OCC and FDIC;
# attachment 12 pages). The same text is the attachment to OCC Bulletin 2026-13. SR 26-2 supersedes
# SR 11-7 (April 4, 2011) and SR 21-8; OCC 2026-13 rescinds OCC 2011-12.
# Outline transcribed 2026-09-07 in Cowork from the OCC 2026-13 attachment (bulletin202613a.pdf,
# 12 pp.); Claude Code re-verifies the headings against SR2602a1.pdf at ingest and records the PDF's
# sha256 in SOURCES.json. Headings are the document's own; section_id values are Quaestor's.
