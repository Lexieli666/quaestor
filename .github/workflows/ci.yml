name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: quality gate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # No provider credentials exist in CI and none may be added. Every test runs offline
      # against FakeLLM, committed cassettes and synthetic subjects; a live call or a download
      # from a test is a defect, not a flake.
      QUAESTOR_CI: "1"
      QUAESTOR_NO_NETWORK: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          # Gate condition 5 diffs `examples/golden_report/` against the commit that introduced
          # it; a shallow clone has no such commit and the check would pass vacuously.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `tests/probatio` is split out of gates 1 and 2 and runs as its own non-blocking step
      # below. The seven `draft_section` cases in it are known-red (D-188) and folding them into
      # the blocking gate hid every other result behind a failure the project has already
      # described in writing. Splitting shows both: gates 1-5 are a true statement about the
      # offline suite, and the Probatio step is a true statement about the cassettes.
      - name: Gate 1 — pytest
        run: pytest -q --ignore=tests/probatio

      - name: Gate 2 — coverage of src/quaestor at least 85%
        run: |
          coverage run -m pytest -q --ignore=tests/probatio
          coverage report --fail-under=85

      - name: Gate 3 — ruff
        run: |
          ruff check src tests eval subjects
          ruff format --check src tests eval subjects

      - name: Gate 4 — mypy --strict
        run: mypy --strict src/quaestor

      # Gate 5 is the golden report: `examples/golden_report/` byte-identical to its introducing
      # commit, and `quaestor validate --synthetic --llm fake` on both subjects producing a report
      # that validates against docs/REPORT_SCHEMA.md. It is owned by
      # `tests/test_golden_spec.py` (Phase 1) and by the CLI (Phase 9), so from Phase 1 it runs
      # inside Gate 1 and needs no step of its own. This step exists to fail loudly if the golden
      # directory ever appears without the test that pins it (DECISIONS D-006).
      - name: Gate 5 — golden report is pinned by a test
        run: |
          if [ -f examples/golden_report/report.md ] && [ ! -f tests/test_golden_spec.py ]; then
            echo "examples/golden_report/ exists but tests/test_golden_spec.py does not." >&2
            echo "Gate condition 5 would pass vacuously. See CLAUDE.md and spec section 7." >&2
            exit 1
          fi
          echo "gate 5a runs inside gate 1 as tests/test_golden_spec.py; 5b applies from Phase 9"

      # Gate 6 arrives with the Probatio test layer in Phase 11. Until `tests/probatio/` exists,
      # `pytest` on a missing path is an error and an empty path collects nothing, so the step is
      # guarded on the directory rather than allowed to fail (DECISIONS D-007).
      #
      # KNOWN-RED, and non-blocking on purpose. `continue-on-error` is set because this step is
      # **expected to fail** at 7 failed / 33 passed: the seven `draft_section` cassettes no
      # longer replay into the same prompt hash, which is DECISIONS **D-188** — filed at the
      # operator's instruction rather than chased, and not fixed in 0.1.0. `README.md` says so in
      # those words, twice: under "What this study is not" and again under "Test layer". Whoever
      # removes `continue-on-error` should be removing it because D-188 is closed, and should
      # delete the README's two paragraphs in the same commit.
      #
      # Non-blocking is not the same as hidden. The step still runs on every push, its output is
      # in the log, and a *worse* result than 7 failed is visible in the summary — which is the
      # whole reason it is a separate named step instead of a `--deselect` buried in gate 1.
      - name: "Gate 6 (known-red, D-188) — Probatio suite in replay, zero provider calls"
        continue-on-error: true
        run: |
          if [ -d tests/probatio ]; then
            # The model the tapes were recorded against comes from `addopts`: an interaction
            # key includes the resolved model, so a session that names none keys on the fake
            # provider's `fake-1` and can never hit a real tape (DECISIONS D-151). The provider
            # stays `fake` and is never called; replay never touches it.
            pytest tests/probatio --cassette=replay
          else
            echo "gate 6: tests/probatio does not exist yet (Phase 11)"
          fi
